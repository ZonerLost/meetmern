plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Secrets live in the git-ignored .env at the repo root — the same file the Dart
// side reads via --dart-define-from-file. The manifest can't see --dart-define,
// so the Maps key is parsed out here. CI can instead export MAPS_API_KEY.
def loadEnv = { File f ->
    def map = [:]
    if (!f.exists()) return map
    f.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith("#")) return
        def idx = trimmed.indexOf("=")
        if (idx <= 0) return
        def key = trimmed.substring(0, idx).trim()
        def value = trimmed.substring(idx + 1).trim()
        // Tolerate quoted values.
        if (value.length() >= 2 &&
            ((value.startsWith("\"") && value.endsWith("\"")) ||
             (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        map[key] = value
    }
    return map
}

def env = loadEnv(rootProject.file("../.env"))
def mapsApiKey = (env.MAPS_API_KEY ?: System.getenv("MAPS_API_KEY") ?: "").toString()

if (mapsApiKey.isEmpty()) {
    logger.warn("MAPS_API_KEY is empty — maps will render blank. " +
                "Copy .env.example to .env and fill it in.")
}

android {
    namespace "com.example.meetmern"   
    compileSdk 36                      
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.example.meetmern"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35                   
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
