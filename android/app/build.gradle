import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Secrets live in the git-ignored env.json at the repo root (same file the
// Dart side reads via --dart-define-from-file). CI can instead export MAPS_API_KEY.
def envFile = rootProject.file("../env.json")
def env = envFile.exists() ? new JsonSlurper().parseText(envFile.text) : [:]
def mapsApiKey = (env.MAPS_API_KEY ?: System.getenv("MAPS_API_KEY") ?: "").toString()

android {
    namespace "com.example.meetmern"   
    compileSdk 36                      
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.example.meetmern"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35                   
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
